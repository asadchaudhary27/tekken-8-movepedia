<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg_aug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <pattern id="grid_aug" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg_aug)"/>
  <rect width="640" height="360" fill="url(#grid_aug)"/>

  <circle cx="140" cy="110" r="130" fill="#38bdf8" opacity="0.18" filter="blur(40px)"/>
  <circle cx="500" cy="210" r="150" fill="#312e81" opacity="0.2" filter="blur(50px)"/>

  <!-- Silhouettes -->
  <g opacity="0.4">
    <polygon points="0,250 90,210 180,235 300,175 410,215 510,165 580,205 640,185 640,360 0,360" fill="#030508"/>
    <polygon points="0,295 130,265 260,285 380,255 500,275 640,245 640,360 0,360" fill="#0a0e16"/>
  </g>

  <!-- Ground Line -->
  <line x1="0" y1="310" x2="640" y2="310" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="315" x2="640" y2="315" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- Frame -->
  <rect x="14" y="14" width="612" height="332" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="20" y="20" width="600" height="320" rx="8" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- Title & Hazard Badges -->
  <text x="34" y="58" fill="#ffffff" font-family="Impact, sans-serif" font-size="24" font-weight="900" letter-spacing="2" text-transform="uppercase">THE ARENA (UNDERGROUND)</text>
  <text x="34" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">CLANDESTINE TOURNAMENT FACILITY</text>

  <g transform="translate(34, 94)">
    <rect width="185" height="20" rx="4" fill="#38bdf8" opacity="0.85"/>
    <text x="10" y="14" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">WALL BLAST • ENCLOSED CAGE</text>
  </g>
</svg>